# herdr-plugin.toml: manifest for the control-tower plugin.
#
# The dashboard (`tower ui`) as a herdr pane.

id = "control-tower"
name = "control-tower"
version = "0.5.2"
description = "A taskboard for a team of Claude Code agents: the board's milestones and tasks."
# The herdr this plugin was built and checked against (`herdr --version`); older ones are
# untested.
min_herdr_version = "0.9.5"
platforms = ["linux", "macos"]

# Build step herdr runs at install time: compile the binary the pane runs.
[[build]]
platforms = ["linux", "macos"]
command = ["cargo", "build", "--release"]

# herdr resolves the relative command against the plugin root.
[[panes]]
id = "ui"
title = "control-tower"
placement = "split"
command = ["./target/release/tower", "ui"]

# herdr actions run a command rather than declare a pane: `tower space` and `tower popup`
# ask herdr to open the dashboard pane. Bind them to keys in herdr's config (README).
[[actions]]
id = "space"
platforms = ["linux", "macos"]
title = "control-tower"
description = "Open the control-tower dashboard in a herdr workspace of its own."
command = ["./target/release/tower", "space"]

[[actions]]
id = "popup"
platforms = ["linux", "macos"]
title = "control-tower popup"
description = "Open the control-tower dashboard in a popup over the work."
command = ["./target/release/tower", "popup"]
